name: Run Python Script (every 3 hours)

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours at minute 0
  workflow_dispatch:        # manual trigger

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run script
        env:
          NEON_HOST: ${{ secrets.DB_HOST }}
          NEON_DB:   ${{ secrets.DB_NAME }}
          NEON_USER: ${{ secrets.DB_USER }}
          NEON_PASS: ${{ secrets.DB_PASSWORD }}
          NEON_PORT: ${{ secrets.DB_PORT }}
        run: |
          python main.py
